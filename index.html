<!doctype html>
<html>
  <head>
    <title>My First Stuff</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Poppins">

    <script src="script.js"></script>
  </head>
  <body>
    <center><h2 class="form-title">KIET Group of Institutions</h2></center>

    <center>
      <div class="parent-container">
        <div class="form-container">
          <div id="form-header-logo">
            <img id="kiet-logo" src="assets/images/kiet.png" alt="Kiet Logo" height="180">
          </div>
          <div class="horizontal-border"></div>
          <form id="form">
            <h2 class="form-heading">Registration Form</h2>
            <div>
              <label>First Name:</label>
              <input type="text" id="fname" placeholder="First Name"/>
              <br />
            </div>

            <div>
              <label>Last Name:</label>
              <input type="text" id="lname" placeholder="Last Name"/>
              <br />
            </div>

            <div>
              <label>Email:</label>
              <input type="email" id="email" placeholder="Email"/>
              <br />
            </div>

            <div>
              <label for="departments">Department:</label>
              <select id="departments">
                <option value="CSE">CSE</option>
                <option value="CSE(AI&ML)">CSE(AI&ML)</option>
                <option value="CSE(AI)">CSE(AI)</option>
              </select>
              <br />
            </div>

            <div>
              <label>Phone Number:</label>
              <input type="tel" id="phone" placeholder="Phone Number"/>
              <br />
            </div>

            <div>
              <label for="password">Password:</label>
              <input type="password" id="passwd" placeholder="Password"/>
              <br />
            </div>

            <div>
              <label for="confirm-password">Confirm Password:</label>
              <input type="password" id="confirm-passwd" placeholder="Confirm Password"/>
              <br />
            </div>

            <input onclick="submitForm()" id="submit-btn" type="button" value="Submit">
          </form>
        </div>
        <div class="vertical-border"></div>
        <div class="boat-image-container">
          <img id="boat" src="assets/images/boat.jpeg" alt="boat" height="770" width="500">
        </div>
      </div>
    </center>
  </body>
</html>
