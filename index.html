<!doctype html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Stuff</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Poppins">

  <script src="script.js"></script>
</head>

<body>
  <h2 class="page-title">KIET Group of Institutions</h2>

  <div class="main-container">
    <div class="form-container">
      <div class="kiet-logo-container">
        <img id="kiet" src="assets/images/kiet.png" alt="KIET LOGO">
      </div>
      <div class="form">
        <form action="">
          <h3 class="form-header">Registration Form</h4>
            <div>
              <label for="fName">First Name:</label>
              <input type="text" name="fName" placeholder="First Name" />
            </div>
            <div>
              <label for="lName">Last Name:</label>
              <input type="text" name="lName" placeholder="Last Name" />
            </div>
            <div>
              <label for="email">Email:</label>
              <input type="email" name="email" placeholder="Email" />
            </div>
            <div>
              <label for="department">Department:</label>
              <select name="department">
                <option value="CSE">CSE</option>
                <option value="CSE(AI&ML)">CSE(AI&ML)</option>
                <option value="CSE(AI)">CSE(AI)</option>
                <option value="CSIT">CSIT</option>
                <option value="IT">IT</option>
              </select>
            </div>
            <div>
              <label for="phoneNumber">Phone Number:</label>
              <input type="tel" name="phoneNumber" placeholder="Phone Number" />
            </div>
            <div>
              <label for="password">Password:</label>
              <input type="password" name="password" placeholder="Password" />
            </div>
            <div>
              <label for="confirmPassword">Confirm Password:</label>
              <input type="password" name="confirmPassword" placeholder="Confirm Password" />
            </div>
            <div>
              <input type="submit" value="Submit">
            </div>
        </form>
      </div>
    </div>
    <div class="boat-container">
      <img id="boat" src="assets/images/boat.jpeg" alt="BOAT">
    </div>
  </div>
</body>

</html>
